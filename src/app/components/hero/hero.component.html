<section id="home" class="hero-section">

  <!-- Layered background + Particles -->
  <div class="hero-bg" aria-hidden="true">
    <canvas #particleCanvas class="particle-canvas"></canvas>
    <div class="hero-glow-1"></div>
    <div class="hero-glow-2"></div>
    <div class="hero-glow-3"></div>
    <div class="hero-grid"></div>
    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>
    <div class="hero-orb hero-orb-3"></div>
  </div>

  <div class="hero-content" [style.transform]="'translateY(' + scrollY() * 0.4 + 'px)'">

    <!-- Eyebrow badge -->
    <div class="hero-badge animate-fade-in">
      <span class="badge-dot pulse-animation"></span>
      <span>IIT Bombay Origin · Precision Agriculture</span>
    </div>

    <!-- Headline -->
    <h1 class="hero-heading">
      <span class="word-reveal" style="animation-delay: 0.4s">Make</span> 
      <span class="word-reveal gradient-text" style="animation-delay: 0.5s">Planet</span>,<br>
      <span class="word-reveal gradient-text" style="animation-delay: 0.6s">People</span>,
      <span class="word-reveal gradient-text" style="animation-delay: 0.7s">Profit</span>
    </h1>


    <!-- Tagline -->
    <p class="hero-tagline animate-slide-up" style="animation-delay:.1s">
      {{ companyInfo().tagline }}
    </p>

    <!-- CTAs -->
    <div class="hero-ctas animate-slide-up" style="animation-delay:.2s">
      <a routerLink="/request-demo" class="btn-primary">
        Request a Demo
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
        </svg>
      </a>
      <a href="#products" (click)="scrollTo($event,'#products')" class="btn-secondary">
        Explore Products
      </a>
    </div>

    <!-- Trust bar -->
    <div class="hero-trust animate-fade-in" style="animation-delay:.3s">
      <span class="trust-item">
        <svg width="14" height="14" fill="none" stroke="#22c55e" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        Patented Technology
      </span>
      <span class="trust-dot"></span>
      <span class="trust-item">
        <svg width="14" height="14" fill="none" stroke="#22c55e" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/></svg>
        8 Countries
      </span>
      <span class="trust-dot"></span>
      <span class="trust-item">
        <svg width="14" height="14" fill="none" stroke="#22c55e" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        72+ Crops
      </span>
      <span class="trust-dot"></span>
      <span class="trust-item">
        <svg width="14" height="14" fill="none" stroke="#22c55e" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        25,000+ Farmers
      </span>
    </div>

    <!-- Impact stats -->
    <div class="hero-stats animate-fade-in" style="animation-delay:.4s">
      <div class="hero-stat">
        <span class="hero-stat-val">40%</span>
        <span class="hero-stat-lbl">Chemical Inputs Reduced</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val">25K+</span>
        <span class="hero-stat-lbl">Farmers Reached</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val">15K+</span>
        <span class="hero-stat-lbl">Hectares Impacted</span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat-val">22%</span>
        <span class="hero-stat-lbl">Productivity Increase</span>
      </div>
    </div>

  </div>

  <!-- Scroll cue -->
  <div class="scroll-cue" aria-hidden="true">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
    </svg>
    <span>Scroll</span>
  </div>

</section>

<!-- Main Video Section (Moved Below Hero) -->
<section class="video-hero-section section-padding">
  <div class="container-custom">
    <div class="video-outer-border">
      <div class="video-container">
        <video 
          #heroVideo
          class="hero-video" 
          autoplay 
          muted 
          loop 
          playsinline
          poster="/images/video-poster.jpg">
          <source src="/vdo/Soilsens - 5th Aug 2025 - Final.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <!-- Video Controls -->
        <button class="video-control-btn" (click)="toggleVideo()" [attr.aria-label]="isVideoPlaying() ? 'Pause video' : 'Play video'">
          @if (isVideoPlaying()) {
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          }
        </button>
      </div>
    </div>
  </div>
</section>
